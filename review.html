<style>
:root{--blue:#156DFF;--red:#F43131;--yel:#FFC100;--ink:#0E0E0E;--sub:#6B7280;--line:#E5E7EB;--bg:#F4F5F7;--wine:#4A0B18}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;font-size:16px;line-height:1.5}
.wrap{max-width:480px;margin:0 auto;padding:20px 16px 40px}
.brand{display:flex;align-items:center;gap:10px;margin:6px 4px 18px}
.dots{display:flex;gap:5px}.dots i{width:10px;height:10px;border-radius:50%;display:block}
.dots i:nth-child(1){background:var(--red)}.dots i:nth-child(2){background:var(--blue)}.dots i:nth-child(3){background:var(--yel)}
.brand b{letter-spacing:.28em;font-size:12px;font-weight:700}
h1{font-size:24px;line-height:1.3;margin:0 4px 6px;font-weight:800}
.lead{color:var(--sub);margin:0 4px 18px;font-size:15px}
.card{background:#fff;border-radius:20px;padding:18px 16px;margin-bottom:12px}
.q{font-weight:700;font-size:16px;margin:0 0 4px}
.hint{color:var(--sub);font-size:13px;margin:0 0 12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 13px;font-size:14px;cursor:pointer;user-select:none}
.chip.on{border-color:var(--blue);background:#EEF4FF;color:var(--blue);font-weight:700}
select,input[type=text],textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px;font-size:16px;font-family:inherit;background:#fff;color:var(--ink)}
textarea{min-height:230px;resize:vertical;line-height:1.6}
.btn:disabled{opacity:.6}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.primary{background:var(--blue);color:#fff}
.ghost{background:#F2F4F6;color:var(--ink)}
.row{display:flex;gap:8px}.row .btn{flex:1}
.post{display:grid;gap:8px}
.post .btn{justify-content:flex-start;padding:14px 16px;background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.post .btn small{margin-left:auto;color:var(--sub);font-weight:500;font-size:12px}
.badge{width:26px;height:26px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:800}
.g{background:#4285F4}.n{background:#03C75A}.nb{background:#03C75A}.ig{background:linear-gradient(45deg,#F58529,#DD2A7B,#8134AF)}
.hidden{display:none}
.note{font-size:12.5px;color:var(--sub);line-height:1.6;margin:14px 4px 0}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:rgba(14,14,14,.92);color:#fff;padding:12px 18px;border-radius:999px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.step{display:inline-block;font-size:11px;font-weight:800;color:var(--blue);letter-spacing:.08em;margin-bottom:4px}
.how{margin:0;padding-left:20px;color:#374151;font-size:14.5px;line-height:1.8}.how b{color:var(--blue)}
.agree{display:flex;gap:8px;align-items:flex-start;font-size:14px;color:#374151;margin-top:14px;line-height:1.5}.agree input{width:18px;height:18px;margin-top:2px;flex:none}
.tone{display:flex;gap:8px}.tone .chip{flex:1;text-align:center}
.brand{justify-content:flex-start}.brand .lang{margin-left:auto;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;color:var(--ink);cursor:pointer;font-family:inherit}
.langnote{font-size:12.5px;color:var(--blue);font-weight:600;margin:-8px 4px 14px}
.kobox{margin-top:12px;background:#F7F8FA;border:1.5px dashed var(--line);border-radius:12px;padding:12px}
.kobox .lbl{font-size:12px;font-weight:700;color:var(--sub);margin-bottom:6px;display:flex;justify-content:space-between}
.kobox textarea{min-height:150px;background:#fff}

    <input type="text" id="cons" maxlength="150">

  <div class="card">
    <p class="q" data-t="qTone"></p>
    <div class="tone chips" id="tone"></div>
    <div style="height:14px"></div>
    <button class="btn primary" id="gen" data-t="gen"></button>
  </div>

  <div class="card hidden" id="out">
    <span class="step">STEP 4</span>
    <p class="q" data-t="q4"></p>
    <textarea id="text"></textarea>
    <div class="kobox hidden" id="koBox"><div class="lbl"><span data-t="koLbl"></span><span id="koState"></span></div><textarea id="ko"></textarea></div>
    <div class="row" style="margin-top:8px">
      <button class="btn ghost" id="again" data-t="again"></button>
      <button class="btn ghost" id="copy" data-t="copy"></button>
    </div>
  </div>

  <div class="card hidden" id="postCard">
    <span class="step">STEP 5</span>
    <p class="q" data-t="q5"></p>
    <button class="btn primary" data-go="google" style="margin:8px 0 14px"><span class="badge g" style="background:#fff;color:#4285F4">G</span><span data-t="goBtn"></span></button>
    <ol class="how" id="how"></ol>
    <label class="agree"><input type="checkbox" id="quote"> <span data-t="agree"></span></label>
    <button class="btn ghost" id="onlyUs" style="margin-top:12px" data-t="onlyUs"></button>
    <p class="hint" style="margin:10px 0 0" data-t="sendHint"></p>
  </div>
  <div class="card hidden" id="thanks" style="text-align:center;padding:28px 16px">
    <div class="dots" style="justify-content:center;margin-bottom:12px"><i></i><i></i><i></i></div>
    <p class="q" style="font-size:19px" data-t="thx1"></p>
    <p class="hint" style="margin:0" data-t="thx2"></p>
  </div>
  <p class="note" data-t="note"></p>
</div>

  occ:['公司聚餐','年终聚会','同学聚会','社团聚会','生日派对','婚礼after party','研讨会/工作坊'],
  likes:['每人5万韩元(含葡萄酒、啤酒、餐食、咖啡)','葡萄酒','啤酒','餐食','咖啡','性价比高','氛围','空间宽敞','员工亲切','流程顺畅','交通方便','适合拍照'],
  tone:['平实','热情','简短'] }
};

/* ===== 언어: 폰 언어 자동 인식, 기본 한국어, 위 토글로 전환 ===== */
const PHONE = new URLSearchParams(location.search).get('lang') || ((navigator.languages && navigator.languages[0]) || navigator.language || 'ko');   // ?lang=fr 로 시험 가능
let cur = /^ko/i.test(PHONE) ? 'ko' : PHONE;           // 후기 언어 (BCP47)
let alt = cur === 'ko' ? 'en' : 'ko';                  // 토글 반대편
const uiOf = l => /^ko/i.test(l) ? 'ko' : /^ja/i.test(l) ? 'ja' : /^zh/i.test(l) ? 'zh' : 'en';
const nativeName = l => { try { const n = new Intl.DisplayNames([l], {type:'language'}).of(l.split('-')[0]); return n.charAt(0).toUpperCase()+n.slice(1); } catch(e){ return l; } };
const enName = l => { try { return new Intl.DisplayNames(['en'], {type:'language'}).of(l); } catch(e){ return l; } };
const isForeign = () => !/^ko/i.test(cur);
let T = I18N[uiOf(cur)];

const $ = id=>document.getElementById(id);
const pick = a=>a[Math.floor(Math.random()*a.length)];
const shuffle = a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1]);
const josa = (w,a,b)=>{const c=w.charCodeAt(w.length-1);return (c>=0xAC00&&c<=0xD7A3&&(c-0xAC00)%28)?a:b;};
const params = new URLSearchParams(location.search);
const sel = $('branch');
const state = { occ: null, likes: new Set(), tone: 'plain' };

function chips(el, keys, labels, kind){
  el.innerHTML='';
  keys.forEach((k,i)=>{
    const c=document.createElement('span');c.className='chip';c.textContent=labels[i];c.dataset.k=k;
    const isOn = kind==='likes' ? state.likes.has(k) : state[kind]===k;
    if (isOn) c.classList.add('on');
    c.onclick=()=>{
      if (kind==='likes'){ state.likes.has(k)?state.likes.delete(k):state.likes.add(k); }
      else if (kind==='occ'){ state.occ = state.occ===k ? null : k; }
      else state.tone = k;
      render();
    };
    el.appendChild(c);
  });
}
function render(){
  T = I18N[uiOf(cur)];
  document.documentElement.lang = uiOf(cur);
  document.querySelectorAll('[data-t]').forEach(el=>{ const v=T[el.dataset.t]; if (typeof v==='string') el.innerHTML=v; });
  $('free').placeholder=T.pFree; $('cons').placeholder=T.pCons;
  $('how').innerHTML = T.how.map(x=>'<li>'+x+'</li>').join('');
  $('langBtn').textContent = nativeName(alt);
  $('langNote').textContent = isForeign() ? T.langNote.replace('{L}', nativeName(cur)) : '';
  $('langNote').classList.toggle('hidden', !isForeign());
  $('koBox').classList.toggle('hidden', !isForeign() || !$('text').value);
  const v = sel.value || params.get('s');
  sel.innerHTML=''; Object.entries(BRANCHES).forEach(([k,b])=>{const o=document.createElement('option');o.value=k;o.textContent=uiOf(cur)==='ko'?b.name:b.en;sel.appendChild(o);});
  if (BRANCHES[v]) sel.value = v;
  chips($('occ'),OCC_K,T.occ,'occ'); chips($('likes'),LIKE_K,T.likes,'likes'); chips($('tone'),TONE_K,T.tone,'tone');
}
$('langBtn').onclick=()=>{ [cur,alt]=[alt,cur]; render(); };

/* ===== Gemini가 실패할 때 쓰는 자체 문장 (한국어 / 영어) ===== */
const KO = I18N.ko;
const F = {
  p50:[ '요즘 물가에 1인 5만원으로 와인, 맥주, 식사, 커피까지 다 되는 곳은 처음 봤어요.', '5만원에 와인·맥주·식사·커피가 전부 들어 있어서 다들 놀랐어요.', '1인 5만원 안에 와인부터 커피까지 다 포함이라 총무 입장에서 정산이 정말 편했어요.' ],
  wine:[ '와인 종류가 생각보다 많았고, 탭에서 바로 따라 줘서 그런지 맛이 깔끔했어요.', '와인 좋아하는 사람들은 이것저것 골라 마시는 재미가 있었다고 해요.' ],
  beer:[ '와인 안 마시는 사람은 맥주로 가면 돼서 술 취향이 갈려도 문제없었어요.', '맥주도 같이 나와서 다들 각자 편한 걸로 마셨어요.' ],
  food:[ '음식이 안주 수준이 아니라 한 끼 식사로 충분했어요.', '음식이 넉넉하게 나와서 다들 배부르게 먹었어요.' ],
  coffee:[ '마지막에 커피까지 나와서 깔끔하게 마무리했어요.', '끝나고 커피까지 챙겨 주는 대관은 처음이었어요.' ],
  value:[ '가격 생각하면 정말 남는 장사였어요.' ], mood:[ '시끄럽지 않아서 대화하기 좋았어요.' ], space:[ '인원이 많았는데도 자리가 넉넉했어요.' ],
  staff:[ '직원분들이 테이블마다 세심하게 챙겨 주셨어요.' ], smooth:[ '세팅부터 마무리까지 알아서 해 주셔서 신경 쓸 게 없었어요.' ], photo:[ '조명이 예뻐서 단체 사진이 잘 나왔어요.' ]
};
const FE = { p50:'₩50,000 per person covered wine, beer, food and coffee. Hard to beat these days.', wine:'The wine, poured straight from the taps, was really good.', beer:'Beer was there too, so everyone found something they liked.',
  food:'The food was a proper meal, not just snacks.', coffee:'They even finished with coffee.', value:'Great value for money.', mood:'Relaxed atmosphere, easy to talk.', space:'Plenty of space for a big group.',
  staff:'The staff were friendly and attentive.', smooth:'Everything ran smoothly from start to finish.', loc:'Easy to find.', photo:'Lovely lighting for group photos.' };
function composeKo(){
  const b = BRANCHES[sel.value], occ = state.occ ? KO.occ[OCC_K.indexOf(state.occ)] : '', tone = state.tone;
  const likes=[...state.likes], free=$('free').value.trim(), cons=$('cons').value.trim(), bn=b.short;
  let first = occ ? (tone==='fun' ? `${occ}${josa(occ,'으로','로')} ${bn} 다녀왔는데 대만족이에요!` : `${occ} 자리로 ${bn}${josa(bn,'을','를')} 이용했어요.`) : `${bn}에서 모임을 했어요.`;
  const head = likes.includes('p50')?['p50']:[]; let rest = shuffle(likes.filter(k=>k!=='p50')).slice(0, tone==='short'?1:4);
  const lines=[first]; [...head,...rest].forEach(k=>{ if(k==='loc') lines.push(`${b.loc} 다들 찾아오기 편했어요.`); else if(F[k]) lines.push(pick(F[k])); });
  if (free) lines.push(/[.!?~]$/.test(free)?free:free+'.'); if (cons) lines.push(`아쉬운 점을 하나 꼽자면, ${/[.!?~]$/.test(cons)?cons:cons+'.'}`);
  lines.push(tone==='fun'?'다음 모임도 무조건 여기예요!':'다음 모임도 여기로 하려고요.');
  return lines.join(' ');
}
function composeEn(){
  const b = BRANCHES[sel.value], occ = state.occ ? I18N.en.occ[OCC_K.indexOf(state.occ)].toLowerCase() : 'group event';
  const lines=[`We had our ${occ} at ${b.en}.`]; [...state.likes].slice(0,5).forEach(k=>FE[k]&&lines.push(FE[k]));
  const free=$('free').value.trim(), cons=$('cons').value.trim(); if (free) lines.push(free); if (cons) lines.push('One thing to improve: '+cons);
  lines.push('Would come back!'); return lines.join(' ');
}

/* ===== 초안 쓰기: Gemini 무료 등급 → 실패하면 자체 문장 ===== */
async function api(params, ms){
  const ctl = new AbortController(); const t = setTimeout(()=>ctl.abort(), ms||9000);
  try { const r = await fetch(SAVE_API,{method:'POST',body:new URLSearchParams(params),credentials:'omit',signal:ctl.signal}); return await r.json(); }
  finally { clearTimeout(t); }
}
async function write(again){
  const p = { type:'write', branch:BRANCHES[sel.value].short, branchEn:BRANCHES[sel.value].en, occ: state.occ ? KO.occ[OCC_K.indexOf(state.occ)] : '',
    likes:[...state.likes].map(k=>KO.likes[LIKE_K.indexOf(k)]).join(', '), free:$('free').value, cons:$('cons').value,
    occEn: state.occ ? I18N.en.occ[OCC_K.indexOf(state.occ)] : '', likesEn:[...state.likes].map(k=>I18N.en.likes[LIKE_K.indexOf(k)]).join(', '),
    tone: KO.tone[TONE_K.indexOf(state.tone)], again: again?'1':'', lang: isForeign()?cur:'ko', langName: isForeign()?enName(cur):'' };
  try { const j = await api(p, isForeign()?12000:8000); if (j && j.ok && j.text) return { text:j.text, ko:j.ko||'' }; } catch(e){}
  return isForeign() ? { text: composeEn(), ko: composeKo() } : { text: composeKo(), ko:'' };
}
async function gen(e){
  const again = e && e.currentTarget && e.currentTarget.id==='again';
  const b1=$('gen'), b2=$('again');
  b1.disabled=b2.disabled=true; b1.textContent=T.writing; if(again) b2.textContent=T.writing;
  try{ const r = await write(again); $('text').value = r.text; $('ko').value = r.ko; koFor = r.text; }
  finally { b1.disabled=b2.disabled=false; b1.textContent=T.gen; b2.textContent=T.again; }
  lastGen = $('text').value;
  $('koState').textContent='';
  $('out').classList.remove('hidden'); $('postCard').classList.remove('hidden'); $('koBox').classList.toggle('hidden', !isForeign());
  $('out').scrollIntoView({behavior:'smooth',block:'start'});
}
$('gen').onclick=gen; $('again').onclick=gen;

/* 외국어 글을 손님이 고치면 1.5초 뒤 한국어 번역도 다시 */
let koFor = '', koTimer = null;
$('text').addEventListener('input', ()=>{
  if (!isForeign()) return;
  clearTimeout(koTimer); $('koState').textContent='…';
  koTimer = setTimeout(async()=>{
    const v = $('text').value.trim(); if (!v || v===koFor) { $('koState').textContent=''; return; }
    try { const j = await api({type:'translate', text:v}, 9000); if (j && j.ok && j.ko && $('text').value.trim()===v) { $('ko').value=j.ko; koFor=v; } } catch(e){}
    $('koState').textContent='';
  }, 1500);
});

/* ===== 복사·저장·이동 ===== */
function payload(){
  const v=$('text').value.trim(), k=$('ko').value.trim();
  return (isForeign() && k) ? v + '\n\n(한국어 번역)\n' + k : v;
}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400);}
async function copy(){
  const v=payload();
  try{ await Promise.race([navigator.clipboard.writeText(v), new Promise((_,r)=>setTimeout(()=>r(new Error('t')),1200))]); }
  catch(e){ const ta=document.createElement('textarea'); ta.value=v; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');}catch(_){} ta.remove(); }
}
$('copy').onclick=async()=>{await copy();toast(T.tCopied);};
function save(action){
  const body = new URLSearchParams({ type:'review', rid:RID, branch:sel.value, occ: state.occ ? KO.occ[OCC_K.indexOf(state.occ)] : '',
    likes:[...state.likes].map(k=>KO.likes[LIKE_K.indexOf(k)]).join(', '), tone:KO.tone[TONE_K.indexOf(state.tone)], text:payload(),
    cons:$('cons').value, action, lang: cur,
    own:[$('free').value.trim()?'한마디':'', ($('text').value.trim()!==lastGen.trim())?'고침':''].filter(Boolean).join(' '), quote:$('quote').checked?'1':'' });
  /* 쿠키 없이: 구글 여러 계정 로그인 상태면 Apps Script가 쿠키 붙은 요청을 거부함 */
  fetch(SAVE_API,{method:'POST',body,mode:'no-cors',credentials:'omit',keepalive:true}).catch(()=>{});
}
$('onlyUs').onclick=()=>{
  if (!$('text').value.trim()) return toast(T.tNeed);
  save('only');
  $('out').classList.add('hidden'); $('postCard').classList.add('hidden'); $('thanks').classList.remove('hidden');
  $('thanks').scrollIntoView({behavior:'smooth',block:'center'});
};
document.querySelectorAll('[data-go]').forEach(btn=>btn.onclick=async()=>{
  const b = BRANCHES[sel.value]; save('google'); await copy();
  toast(T.tGo);
  setTimeout(()=>{ location.href = 'https://search.google.com/local/writereview?placeid='+b.google+(isForeign()?'&hl='+encodeURIComponent(cur):''); }, 700);
});
render();
</script>
</body>
</html>
